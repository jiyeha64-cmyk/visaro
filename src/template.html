<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>비자로</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: Korean public-service portal, sober, orderly, trustworthy
   IDEA: a civil-petition guide page on a government-style portal (without any official emblem)
   PICTURE: the step indicator and the petition-form-like checklist table
   COLOUR and TYPE: white, gov navy #0b2d6b, link blue #1b5fd6, gray panels, orange only for conditional items; Noto Sans KR
   LAYOUT: notice bar, header with logo and language, breadcrumb title, step indicator, form-style sections */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0f1218);--sub:light-dark(#f4f6f9,#171c25);--card:light-dark(#fff,#141922);--ink:light-dark(#1e2124,#e6e9ee);--mut:light-dark(#555c66,#a2aab6);--line:light-dark(#d6dbe1,#2c3442);--lin2:light-dark(#b9c1cc,#3a4456);--n:light-dark(#0b2d6b,#8fb2ff);--nf:#0b2d6b;--p:light-dark(#1b5fd6,#8fb2ff);--pbg:light-dark(#eaf1fd,#1a2742);--on:light-dark(#fff,#0f1218);--o:light-dark(#b54708,#ffb37a);--obg:light-dark(#fdf1e7,#3a2414);--red:light-dark(#c62828,#ff8a80)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip;word-break:keep-all;overflow-wrap:anywhere}
html[lang=zh] body{font-family:"Noto Sans SC","Noto Sans KR",system-ui,sans-serif}html[lang=ja] body{font-family:"Noto Sans JP","Noto Sans KR",system-ui,sans-serif}
.in{max-width:1180px;margin:0 auto;padding:0 max(4vw,16px)}
.notice{background:light-dark(#f1f3f6,#1a1f29);border-bottom:1px solid var(--line);font-size:13px;color:var(--mut)}
.notice .in{display:flex;align-items:center;gap:8px;min-height:36px;flex-wrap:wrap}
.notice b{color:var(--red);font-weight:500}
header{border-bottom:1px solid var(--line);background:var(--bg)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;min-height:76px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:40px;height:40px;flex:none}
.logo{margin:0;font-weight:700;font-size:26px;line-height:1;color:var(--n);letter-spacing:-.01em}
.logo small{font-size:13px;font-weight:500;color:var(--mut);margin-left:8px;letter-spacing:0}
.langs{display:flex;border:1px solid var(--lin2);border-radius:4px;overflow:hidden}
.langs button{font:inherit;font-size:14px;min-height:40px;padding:4px 14px;border:0;border-left:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.langs button:first-child{border-left:0}
.langs button[aria-pressed=true]{background:var(--nf);color:#fff;font-weight:500}
.gnb{background:var(--nf);color:#fff}
.gnb .in{display:flex;gap:28px;min-height:48px;align-items:center;font-size:15px;font-weight:500;overflow-x:auto}
.gnb button{font:inherit;color:#fff;background:none;border:0;cursor:pointer;white-space:nowrap;opacity:.8;min-height:48px;padding:0 2px}.gnb button:hover{opacity:1}.gnb button.cur{opacity:1;box-shadow:inset 0 -3px 0 #fff}.gnb button:focus-visible{outline:3px solid #fff;outline-offset:-3px}
.help ol{margin:0;padding-left:1.3em}.help li{margin:6px 0}.help{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:18px 22px}
.stn,#qs,#slip{scroll-margin-top:12px}
.titlebar{background:var(--sub);border-bottom:1px solid var(--line);padding:22px 0 24px}
.crumb{font-size:13px;color:var(--mut);margin:0 0 6px}
.titlebar h1{margin:0;font-size:clamp(24px,3vw,32px);line-height:1.25;font-weight:700;color:var(--ink)}
.titlebar p{margin:8px 0 0;color:var(--mut);max-width:72ch;font-size:15px}
.route{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:22px 0 0;border:1px solid var(--lin2);border-radius:4px;background:var(--card);counter-reset:s}
.route button{font:inherit;background:var(--card);border:0;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:15px;color:var(--mut);border-left:1px solid var(--line);position:relative}
.route button:first-child{border-left:0}
.route i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1px solid var(--lin2);font-style:normal;font-size:14px;font-weight:700;flex:none;background:var(--card)}
.route button:hover{background:var(--pbg)}.route button:focus-visible{outline:3px solid var(--p);outline-offset:-3px}.route .on,.route .on:hover{background:var(--nf);color:#fff;font-weight:700}.route .on i{background:#fff;color:var(--nf);border-color:#fff}
.route .ok{color:var(--n)}.route .ok i{background:var(--pbg);color:var(--n);border-color:var(--n)}
@media(max-width:600px){.route button{font:inherit;background:var(--card);border:0;cursor:pointer;text-align:left;flex-direction:column;gap:4px;text-align:center;font-size:13px;padding:10px 6px}}
.wrap{max-width:1180px;margin:0 auto;padding:30px max(4vw,16px) 40px}
.stn{margin-bottom:34px}.stn>.num{display:none}
.step{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700;color:var(--ink);margin:0 0 12px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.step::before{content:"";width:8px;height:8px;background:var(--n);flex:none}
.pick{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:18px 20px}
.pick .top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.pick h2{margin:0;font-size:17px;flex:1 1 auto}
input[type=search],input[type=text],input[type=date]{font:inherit;font-size:16px;min-height:44px;padding:8px 12px;border:1px solid var(--lin2);border-radius:4px;background:var(--card);color:var(--ink)}
input:focus{border-color:var(--p)}
#search{width:min(340px,100%)}
input:focus-visible,button:focus-visible{outline:3px solid var(--p);outline-offset:2px}
.grp{margin:16px 0 6px;font-size:14px;color:var(--ink);font-weight:700}
.visas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.visas button{font:inherit;text-align:left;min-height:54px;padding:8px 12px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink);cursor:pointer;line-height:1.3}
.visas button.mg{background:#f4f5f7;color:var(--mut)}.visas button .vn{font-style:normal;font-size:12px;font-weight:700;color:var(--red)}
.visas button:hover{border-color:var(--p);background:var(--pbg)}
.visas b{display:block;font-size:15px;color:var(--n)}.visas span{font-size:13px;color:var(--mut)}
.chosen{display:none;align-items:center;gap:12px;flex-wrap:wrap}
.pick.done .chosen{display:flex}.pick.done .list{display:none}
.chosen strong{font-size:18px;color:var(--n)}.chosen p{margin:0;color:var(--mut);font-size:14px;flex-basis:100%}
.linkbtn{font:inherit;font-size:14px;min-height:38px;padding:4px 14px;border-radius:4px;border:1px solid var(--lin2);background:var(--card);color:var(--ink);cursor:pointer}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;align-items:start}
@media(max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.q{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px 18px 14px;margin-bottom:10px}
.q.ovq{border-color:var(--o);background:var(--obg)}
.q h3{margin:0 0 4px;font-size:16px;font-weight:700}.q .hint{margin:0 0 8px;color:var(--mut);font-size:14px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.opts button{font:inherit;font-size:15px;min-height:44px;padding:8px 14px;border-radius:4px;border:1px solid var(--lin2);background:var(--card);color:var(--ink);cursor:pointer;text-align:left;line-height:1.35}
.opts button:hover{border-color:var(--p)}
.opts button[aria-pressed=true]{background:var(--nf);border-color:var(--nf);color:#fff;font-weight:500}
.tocalc{font:inherit;font-size:14px;margin-top:10px;padding:0;border:0;background:none;color:var(--p);text-decoration:underline;cursor:pointer;min-height:32px}
.noq{color:var(--mut);background:var(--sub);border:1px solid var(--line);border-radius:4px;padding:16px 18px}
.slip{position:sticky;top:16px;background:var(--card);border:1px solid var(--lin2);border-top:3px solid var(--nf);border-radius:0}
@media(max-width:900px){.slip{position:static}}
.slip .head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;background:var(--sub);border-bottom:1px solid var(--line)}
.slip h2{margin:0;font-size:18px}.cnt{font-size:14px;white-space:nowrap;color:var(--n);font-weight:500}
.slipbody{padding:4px 20px 18px}
.empty{color:var(--mut);padding:26px 0;text-align:center}
.prog{height:6px;background:var(--line);overflow:hidden;margin:12px auto 0;max-width:240px}.prog i{display:block;height:100%;background:var(--nf);transition:width .3s}
@media(prefers-reduced-motion:reduce){.prog i{transition:none}}
.doc{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.box{width:22px;height:22px;border:1px solid var(--lin2);border-radius:3px;margin-top:2px;cursor:pointer;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;background:var(--card);padding:0}
.box[aria-checked=true]{background:var(--nf);border-color:var(--nf)}
.doc b{font-weight:500}.why{display:block;color:var(--mut);font-size:14px;margin-top:2px}
.tag{display:inline-block;font-size:12px;padding:0 7px;border:1px solid var(--lin2);border-radius:3px;margin-right:6px;vertical-align:1px;white-space:nowrap;color:var(--mut);font-weight:500;line-height:20px}
.tag.t2{border-color:var(--p);color:var(--p);background:var(--pbg)}.tag.t3{border-color:var(--o);color:var(--o);background:var(--obg)}
.dinfo{margin-top:6px;font-size:14px}
.dinfo summary{cursor:pointer;color:var(--p);display:inline-flex;align-items:center;min-height:32px;list-style:none}
.dinfo summary::-webkit-details-marker{display:none}
.dinfo summary::before{content:"ⓘ";margin-right:5px;font-size:13px}
.dinfo summary::after{content:"▾";margin-left:4px;font-size:12px}.dinfo[open] summary::after{content:"▴"}
.dinfo>p{margin:4px 0 0;padding:10px 12px;background:var(--sub);border:1px solid var(--line);border-bottom:0;color:var(--ink)}
.dinfo>p:last-child,.dinfo>p.dl:last-child{border-bottom:1px solid var(--line)}
.dinfo .dl{margin:0!important;display:flex;flex-wrap:wrap;gap:6px 14px}
.dinfo a{color:var(--p);font-weight:500;text-underline-offset:2px}
.crit{margin:0;padding:10px 12px;background:var(--pbg);border:1px solid var(--line);border-top:0}
.crit b{display:block;font-size:13px;color:var(--n);margin-bottom:4px}.crit ul{margin:0;padding-left:1.2em}.crit li{margin:3px 0}
.note{margin:14px 0 0;padding:12px 14px;border:1px solid var(--line);background:var(--sub);font-size:14px;color:var(--ink)}
.note::before{content:"※ ";color:var(--o);font-weight:700}
.info{padding:18px 0;font-size:15px}
.foot{margin-top:14px;font-size:13px;color:var(--mut)}.foot strong{color:var(--red);font-weight:500}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.acts button,.cbtn{font:inherit;font-size:14px;min-height:40px;padding:6px 16px;border-radius:4px;border:1px solid var(--lin2);background:var(--card);color:var(--ink);cursor:pointer}
.cbtn.pri,#copy{background:var(--nf);border-color:var(--nf);color:#fff;font-weight:500}
#calc{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:20px 22px;scroll-margin-top:16px}
#calc h2{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}#calc .lead{margin:0 0 12px;color:var(--mut);font-size:14px;max-width:72ch}
.rule{display:inline-block;font-size:13px;padding:4px 10px;border:1px solid var(--o);color:var(--o);background:var(--obg);border-radius:3px;margin-bottom:12px}
.crow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end;margin-bottom:8px}
.crow label{display:block;font-size:13px;color:var(--mut);margin-bottom:2px}.crow input{width:100%}
.del{font:inherit;min-width:44px;min-height:44px;border:1px solid var(--lin2);border-radius:4px;background:var(--card);color:var(--mut);cursor:pointer}
@media(max-width:640px){.crow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}.crow .cn{grid-column:1/-1}}
.appd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.appd label{font-size:14px;color:var(--mut)}
.res{margin-top:14px;border-top:2px solid var(--ink);padding-top:4px}
.rline{display:flex;justify-content:space-between;gap:10px;padding:10px 4px;font-size:15px;border-bottom:1px solid var(--line)}
.rline .d{white-space:nowrap;color:var(--mut)}.rline.bad .d{color:var(--red);white-space:normal;text-align:right}.rline.hit .d{color:var(--o);font-weight:700}
.verdict{margin:12px 0 0;padding:12px 14px;font-size:15px;border:1px solid}
.verdict.y{background:var(--obg);color:var(--o);border-color:var(--o)}.verdict.n{background:var(--pbg);color:var(--n);border-color:var(--p)}
.small{font-size:13px;color:var(--mut);margin-top:10px}
.sitefoot{background:var(--sub);border-top:1px solid var(--line);color:var(--mut);font-size:13px;padding:22px 0}
.sitefoot p{margin:2px 0}
</style></head><body>
<div class="notice"><div class="in"><b data-t="nb"></b><span data-t="nt"></span></div></div>
<header><div class="in hrow"><div class="brand"><svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="6" fill="#0b2d6b"/><rect x="10" y="9" width="20" height="23" rx="2" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M14.5 16h11M14.5 21h11M14.5 26h6" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="29" cy="29" r="6" fill="#1b5fd6" stroke="#fff" stroke-width="2"/><path d="m26.4 29 1.8 1.8 3.3-3.4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><p class="logo">비자로<small data-t="sub"></small></p></div><div class="langs" role="group" aria-label="Language"><button data-l="ko">한국어</button><button data-l="en">English</button><button data-l="zh">中文</button><button data-l="ja">日本語</button></div></div></header>
<nav class="gnb" aria-label="메뉴"><div class="in"><button type="button" class="cur" data-go="sec1" data-t="m1"></button><button type="button" data-go="sec3" data-t="m2"></button><button type="button" data-go="sec4" data-t="m3"></button></div></nav>
<section class="titlebar"><div class="in"><p class="crumb" data-t="crumb"></p><h1 data-t="h1"></h1><p data-t="lead"></p>
<nav class="route" aria-label="진행 단계"><button type="button" id="r1" data-go="sec1"><i>1</i><span data-t="r1"></span></button><button type="button" id="r2" data-go="qs"><i>2</i><span data-t="r2"></span></button><button type="button" id="r3" data-go="slip"><i>3</i><span data-t="r3"></span></button></nav></div></section>
<div class="wrap">
<div class="stn" id="sec1"><span class="num">1</span><p class="step" data-t="r1"></p>
<section class="pick" id="pick">
<div class="list"><div class="top"><h2 data-t="pickh"></h2><input id="search" type="search"></div><div id="visas"></div></div>
<div class="chosen"><strong id="chName"></strong><button class="linkbtn" id="change" type="button" data-t="change"></button><p id="chDesc"></p></div>
</section></div>
<div class="stn"><span class="num">2</span><p class="step"><span data-t="r2"></span> · <span data-t="r3"></span></p>
<main class="two">
<section id="qs"></section>
<aside class="slip" id="slip" aria-live="polite"><div class="head"><h2 data-t="sliph"></h2><span class="cnt" id="cnt"></span></div><div class="slipbody"><div id="out"></div><div id="xnote"></div>
<p class="foot"><span data-t="foot1"></span> <strong data-t="foot2"></strong> <span data-t="foot3"></span></p>
<div class="acts"><button id="copy" type="button" data-t="copy"></button><button id="reset" type="button" data-t="reset"></button></div></div></aside>
</main><div style="height:26px"></div></div>
<div class="stn" id="sec3"><span class="num">+</span><p class="step" data-t="calch"></p>
<section id="calc" aria-labelledby="calch">
<h2 id="calch" data-t="calch"></h2><p class="lead" data-t="calclead"></p>
<span class="rule" id="rule"></span>
<div class="appd"><label for="appDate" data-t="appdate"></label><input type="date" id="appDate"></div>
<div id="rows"></div>
<button class="cbtn" id="addRow" type="button" data-t="addrow"></button>
<div class="res" id="res"></div>
<p class="small" data-t="calcnote"></p>
</section></div>
<div class="stn last" id="sec4"><p class="step" data-t="m3"></p><div class="help"><ol><li data-t="hp1"></li><li data-t="hp2"></li><li data-t="hp3"></li><li data-t="hp4"></li><li data-t="hp5"></li></ol></div></div>
</div>
<footer class="sitefoot"><div class="in"><p data-t="ft1"></p><p data-t="ft2"></p></div></footer>
<script>
{

const LANGS=['ko','en','zh','ja'];
const IDX=new Map(STR.map((s,i)=>[s,i]));
let L='ko';try{const s=localStorage.getItem('visaLang');if(LANGS.includes(s))L=s}catch(e){}
const li=()=>LANGS.indexOf(L);
const T=s=>{if(!s||L==='ko')return s;const i=IDX.get(s);return i==null?s:(TR[L][i]||s)};
const U=(k,o)=>{let s=UI[k][li()];if(o)for(const x in o)s=s.split('{'+x+'}').join(o[x]);return s};
const GROUPS=['유학·연수','취업·사업','전문직 취업','비전문 취업','가족·동포','단기 방문','외교·공무','기타'];
const $=id=>document.getElementById(id);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let V=null,ans={},done={},ovC=[];
const ok=c=>!c||Object.keys(c).every(k=>c[k].includes(ans[k]));
function applyLang(){
  document.documentElement.lang=L;
  document.querySelectorAll('[data-t]').forEach(e=>{e.innerHTML=U(e.dataset.t)});
  document.querySelectorAll('.langs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===L));
  $('search').placeholder=U('ph');$('search').setAttribute('aria-label',U('pickh'));
  if(V){$('chName').textContent=`${V.c} ${T(V.n)}`;$('chDesc').textContent=T(V.d)}
  drawVisas($('search').value);render();drawRows();calc();
}
function drawVisas(f){
  f=(f||'').trim().toLowerCase();
  $('visas').innerHTML=GROUPS.map(g=>{
    const Ls=D.filter(v=>v.g===g&&(!f||[v.c,v.n,v.d,T(v.n),T(v.d)].join(' ').toLowerCase().includes(f)));
    return Ls.length?`<p class="grp">${esc(T(g))}</p><div class="visas">${Ls.map(v=>`<button type="button" data-c="${v.c}"${v.mg?' class="mg"':''}><b>${esc(v.c)}${v.mg?` <em class="vn">(${U('merged')})</em>`:''}</b><span>${esc(T(v.n))}</span></button>`).join('')}</div>`:'';
  }).join('')||`<p class="empty">${U('none')}</p>`;
}
function choose(c){
  V=D.find(v=>v.c===c);ans={};done={};ovC=[];
  $('pick').classList.add('done');$('chName').textContent=`${V.c} ${T(V.n)}`;$('chDesc').textContent=T(V.d);
  try{history.replaceState(null,'','#'+V.c.replace(/[^A-Za-z0-9]/g,'').toLowerCase())}catch(e){}
  render();calc();
}
function visibleQs(){const out=[];for(const q of V.q){if(ok(q.if))out.push(q);else delete ans[q.k]}return out}
function route(st){['r1','r2','r3'].forEach((id,i)=>{const e=$(id);e.className=i<st?'ok':(i===st?'on':'')})}
function render(){
  if(!V){route(0)}
  if(!V){$('qs').innerHTML=`<p class="noq">${U('pickfirst')}</p>`;$('out').innerHTML=`<p class="empty">${U('slipempty')}</p>`;$('cnt').textContent='';$('xnote').innerHTML='';return}
  const Q=visibleQs();
  $('qs').innerHTML=Q.length?Q.map((q,i)=>`<div class="q${q.ov?' ovq':''}"><h3>${i+1}. ${esc(T(q.t))}</h3>${q.h?`<p class="hint">${esc(T(q.h))}</p>`:''}<div class="opts" data-k="${q.k}">${q.o.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${ans[q.k]===v}">${esc(T(l))}</button>`).join('')}</div>${q.ov?`<button type="button" class="tocalc">${U('tocalc')}</button>`:''}</div>`).join(''):`<p class="noq">${U('noq')}</p>`;
  $('xnote').innerHTML=V.x?`<p class="note">${esc(T(V.x))}</p>`:'';
  if(V.none){route(2);$('cnt').textContent='';$('out').innerHTML=`<p class="info">${esc(T(V.none))}</p>`;return}
  const n=Q.filter(q=>ans[q.k]).length;
  route(n<Q.length?1:2);
  if(n<Q.length){$('cnt').textContent=U('sel',{n,t:Q.length});$('out').innerHTML=`<p class="empty">${U('more',{n:Q.length-n})}</p><div class="prog"><i style="width:${n/Q.length*100}%"></i></div>`;return}
  const Ls=list(),c=Ls.filter(d=>done[d.id]).length;
  $('cnt').textContent=U('ready',{n:c,t:Ls.length});
  $('out').innerHTML=Ls.map(d=>`<div class="doc"><button type="button" class="box" role="checkbox" aria-checked="${!!done[d.id]}" aria-label="${esc(d.name)}" data-id="${d.id}">${done[d.id]?'✓':''}</button><div><span class="tag ${d.cls}">${esc(d.tag)}</span><b>${esc(d.name)}</b>${d.why?`<span class="why">${esc(d.why)}</span>`:''}${infoHtml(d.k1)}</div></div>`).join('');
}
function infoHtml(name){
  const it=INFO.find(x=>x.m.test(name));if(!it||!it.w)return '';
  const i=li();const cr=it.crit&&(!it.critFor||it.critFor.includes(V.c))?CRIT[it.crit]:null;
  const links=it.l.map(k=>`<a href="${LK[k].u}" target="_blank" rel="noopener">${esc(LK[k].t[i])} ↗</a>`).join('');
  return `<details class="dinfo"><summary>${U('where')}</summary><p>${esc(it.w[i])}</p>${links?`<p class="dl">${links}</p>`:''}${cr?`<div class="crit"><b>${esc(cr.t[i])}</b><ul>${cr.items.map(x=>`<li>${esc(x[i])}</li>`).join('')}</ul></div>`:''}</details>`;
}
function list(){
  return V.docs.map((d,i)=>({i,k1:d[1],k:d[0],tag:T(d[0]),name:T(d[1]),why:T(d[2]),c:d[3]})).filter(d=>ok(d.c)).map(d=>({...d,name:d.k==='해외체류'&&ovC.length?d.name+' — '+ovC.join(', '):d.name,id:V.c+'-'+d.i,cls:d.k==='공통'?'':(/해당자|확인|면제|해외체류/.test(d.k)?'t3':'t2')}));
}
/* calculator */
const today=new Date();const iso=d=>d.toISOString().slice(0,10);
$('appDate').value=iso(today);
let rows=[{c:'',f:'',t:''}];
function drawRows(){
  $('rows').innerHTML=rows.map((r,i)=>`<div class="crow" data-i="${i}"><div class="cn"><label for="c${i}">${U('country')}</label><input type="text" id="c${i}" data-k="c" value="${esc(r.c)}" placeholder="${esc(U('cph'))}"></div><div><label for="f${i}">${U('from')}</label><input type="date" id="f${i}" data-k="f" value="${r.f}"></div><div><label for="t${i}">${U('to')}</label><input type="date" id="t${i}" data-k="t" value="${r.t}"></div><button type="button" class="del" aria-label="${U('del')}" data-del="${i}">✕</button></div>`).join('');
}
const pd=s=>{if(!s)return null;const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))};
const addM=(d,m)=>{const x=new Date(d);const day=x.getUTCDate();x.setUTCDate(1);x.setUTCMonth(x.getUTCMonth()+m);const last=new Date(Date.UTC(x.getUTCFullYear(),x.getUTCMonth()+1,0)).getUTCDate();x.setUTCDate(Math.min(day,last));return x};
function diff(a,b){let y=0,mo=0;while(addM(a,(y+1)*12)<=b)y++;while(addM(a,y*12+mo+1)<=b)mo++;const base=addM(a,y*12+mo);const d=Math.round((b-base)/864e5);return {y,mo,d}}
function rule(){const m=V&&V.ovm||6,w=V?V.ovw:5;return {m,w:w==null?5:w}}
let lastHit=null;
function calc(){
  const {m,w}=rule();
  $('rule').textContent=U('rule',{m,w:w?U('win'):''});
  const app=pd($('appDate').value)||pd(iso(today));
  const ws=w?addM(app,-12*w):null;
  const out=[];const hits=[];
  rows.forEach(r=>{const f=pd(r.f);if(!f)return;let t=pd(r.t)||app;if(t>app)t=app;let s=f;let clipped=false;if(ws&&s<ws){s=ws;clipped=true}
    if(pd(r.t)&&pd(r.t)<f){out.push({r,name:r.c.trim()||U('unnamed'),txt:U('baddate'),hit:false,bad:true});return}
    if(t<=s){out.push({r,name:r.c.trim()||U('unnamed'),txt:U('dur',{y:0,mo:0,d:0})+' '+U('counted'),hit:false});return}
    const dd=diff(s,t);const hit=addM(s,m)<=t;const name=r.c.trim()||U('unnamed');if(hit&&!hits.includes(name))hits.push(name);
    out.push({r,name,txt:U('dur',dd)+(clipped?' '+U('counted'):''),hit});});
  if(!out.length){$('res').innerHTML=`<p class="small">${U('nodata')}</p>`;lastHit=null;return}
  lastHit=hits;
  const canApply=V&&V.q.some(q=>q.ov)&&visibleQs().some(q=>q.ov);
  $('res').innerHTML=out.map(o=>`<div class="rline${o.hit?' hit':''}${o.bad?' bad':''}"><span>${esc(o.name||o.r.c||U('unnamed'))}</span><span class="d">${esc(o.txt)}</span></div>`).join('')+
   `<p class="verdict ${hits.length?'y':'n'}">${hits.length?esc(U('yes',{c:hits.join(', ')})):U('no')}</p>`+
   (canApply?`<div class="acts"><button type="button" class="cbtn pri" id="applyRes">${U('apply')}</button></div>`:'');
}
$('rows').addEventListener('input',e=>{const row=e.target.closest('.crow');if(!row)return;rows[+row.dataset.i][e.target.dataset.k]=e.target.value;calc()});
$('rows').addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(!b)return;rows.splice(+b.dataset.del,1);if(!rows.length)rows=[{c:'',f:'',t:''}];drawRows();calc()});
$('addRow').addEventListener('click',()=>{rows.push({c:'',f:'',t:''});drawRows();calc();const ins=$('rows').querySelectorAll('input[data-k=c]');ins[ins.length-1].focus()});
$('appDate').addEventListener('input',calc);
$('res').addEventListener('click',e=>{if(e.target.id!=='applyRes'||!lastHit)return;ans.ov=lastHit.length?'y':'n';ovC=lastHit.slice();render();e.target.textContent=U('applied');document.querySelector('.slip').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})});
/* events */
document.querySelector('.route').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b)return;const tgt=b.dataset.go==='qs'&&!V?'sec1':(b.dataset.go==='slip'&&!V?'sec1':b.dataset.go);$(tgt).scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});if(tgt==='sec1'&&!V)$('search').focus({preventScroll:true})});
document.querySelector('.gnb').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b)return;document.querySelectorAll('.gnb [data-go]').forEach(x=>x.classList.toggle('cur',x===b));$(b.dataset.go).scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})});
$('visas').addEventListener('click',e=>{const b=e.target.closest('button');if(b)choose(b.dataset.c)});
$('search').addEventListener('input',e=>drawVisas(e.target.value));
$('change').addEventListener('click',()=>{$('pick').classList.remove('done');drawVisas($('search').value);$('search').focus()});
$('qs').addEventListener('click',e=>{if(e.target.closest('.tocalc')){$('calc').scrollIntoView({behavior:'smooth'});return}const b=e.target.closest('.opts button');if(!b)return;const k=b.parentElement.dataset.k;ans[k]=b.dataset.v;if(k==='ov'&&b.dataset.v!=='y')ovC=[];render();calc()});
$('out').addEventListener('click',e=>{const b=e.target.closest('.box');if(!b)return;done[b.dataset.id]=!done[b.dataset.id];render()});
$('reset').addEventListener('click',()=>{ans={};done={};ovC=[];render();calc()});
document.querySelector('.langs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;L=b.dataset.l;try{localStorage.setItem('visaLang',L)}catch(x){}applyLang()});
$('copy').addEventListener('click',async()=>{
  if(!V)return;const Q=visibleQs();
  const txt=V.none?T(V.none):list().map(d=>`- [${d.tag}] ${d.name}${d.why?' ('+d.why+')':''}`).join('\n');
  const head=`${V.c} ${T(V.n)}\n`+Q.filter(q=>ans[q.k]).map(q=>`· ${T(q.t)} ${T(q.o.find(o=>o[0]===ans[q.k])[1])}`).join('\n');
  try{await navigator.clipboard.writeText(head+'\n\n'+txt);$('copy').textContent=U('copied')}catch(e){$('copy').textContent=U('nocopy')}
  setTimeout(()=>{$('copy').textContent=U('copy')},1600);
});
const h=(location.hash||'').slice(1);const hv=h&&D.find(v=>v.c.replace(/[^A-Za-z0-9]/g,'').toLowerCase()===h);
applyLang();if(hv)choose(hv.c);
}
</script>
</body></html>
